<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>PJH Desk</title>
<link rel="stylesheet" href="desk.css">
</head>
<body>
  <div class="desk">
    <header class="bar">
      <span class="brand">PJH-DESK</span>
      <div class="bar-actions">
        <button id="btn-settings" class="icon-btn" title="설정 (집중 시간, 번역)">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
        </button>
        <button id="btn-pin" class="icon-btn" title="항상 위에 두기">
          <svg viewBox="0 0 16 16"><path d="M5 2h6l-1 4 3 3H3l3-3zM8 9v5"/></svg>
        </button>
        <button id="btn-refresh" class="icon-btn" title="새로고침">
          <svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2v3h-3"/></svg>
        </button>
        <button id="btn-hide" class="icon-btn" title="작게 접기 (누르면 다시 펼쳐져요 · Ctrl+Alt+D)">
          <svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg>
        </button>
      </div>
    </header>

    <section class="clock">
      <div id="time" class="time">--:--</div>
      <div id="date" class="date"></div>
      <div id="now-playing" class="np hidden">
        <div class="np-text">
          <div class="np-title" id="np-title"></div>
          <div class="np-sub" id="np-sub"></div>
        </div>
        <div class="np-ctrl">
          <button class="icon-btn" data-media="prev" title="이전"><svg viewBox="0 0 16 16"><path d="M4 3v10M13 3 6 8l7 5z"/></svg></button>
          <button class="icon-btn" data-media="toggle" id="np-toggle" title="재생/일시정지"><svg viewBox="0 0 16 16"><path d="M5 3v10M11 3v10"/></svg></button>
          <button class="icon-btn" data-media="next" title="다음"><svg viewBox="0 0 16 16"><path d="M12 3v10M3 3l7 5-7 5z"/></svg></button>
        </div>
      </div>
    </section>

    <section class="block today">
      <div class="today-col" id="focus">
        <div class="label">집중 <span class="count" id="focus-count"></span></div>
        <div class="focus-time" id="focus-time">25:00</div>
        <div class="focus-mode link" id="focus-cfg" title="눌러서 시간 바꾸기">25분 집중 · 5분 휴식</div>
        <div class="focus-btns">
          <button class="pill" id="focus-start">시작</button>
          <button class="pill ghost" id="focus-reset">초기화</button>
        </div>
      </div>
      <div class="today-col" id="lockbox">
        <div class="label">자리 비움</div>
        <div class="lock-sum" id="lock-sum"><span class="muted small">기록 없음</span></div>
        <div class="lock-warn" id="lock-warn"></div>
        <button class="pill" id="lock-now" title="지금 잠그기 (PJH-LOCK)">지금 잠그기</button>
      </div>
    </section>

    <section class="block" id="weather">
      <div class="label">날씨</div>
      <div id="weather-body" class="muted small">불러오는 중...</div>
    </section>

    <section class="block" id="system">
      <div class="label">시스템</div>
      <div class="meters" id="sys-meters"></div>
      <div class="net" id="sys-net"><div class="muted small">네트워크 확인 중...</div></div>
      <div class="svc" id="sys-status"></div>
    </section>

    <section class="block" id="todo">
      <div class="label">오늘 할 일 <span id="todo-count" class="count"></span></div>
      <ul id="todo-list" class="todo-list"></ul>
      <input id="todo-input" class="todo-input" maxlength="200" placeholder="할 일 추가 후 Enter">
    </section>

    <section class="block news">
      <div class="tabs" id="tabs">
        <button class="tab" data-tab="korea">한국</button>
        <button class="tab" data-tab="world">세계</button>
        <button class="tab" data-tab="geek">GeekNews</button>
        <button class="tab" data-tab="hn" title="Hacker News">HN</button>
        <button class="tab" data-tab="kev" title="실제 공격에 쓰이는 최신 취약점 (CISA KEV)">보안</button>
      </div>
      <div id="news-list" class="news-list"><div class="muted small">불러오는 중...</div></div>
    </section>

    <footer class="foot"><span id="updated"></span><span id="tr-state" class="tr-state"></span></footer>

    <div class="settings hidden" id="settings">
      <div class="settings-head">
        <span>설정</span>
        <button class="icon-btn" id="settings-close" title="닫기"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>

      <div class="set-section" id="set-focus">
        <div class="label">집중 타이머</div>
        <div class="set-row">
          <label>집중 <input type="number" id="cfg-focus" min="1" max="180" step="1"> 분</label>
          <label>휴식 <input type="number" id="cfg-break" min="1" max="60" step="1"> 분</label>
        </div>
        <div class="set-actions"><button class="pill" id="cfg-focus-save">적용</button><span class="set-msg" id="cfg-focus-msg"></span></div>
      </div>

      <div class="set-section" id="set-translate">
        <div class="label">뉴스 번역</div>
        <select id="tr-provider">
          <option value="deepl">DeepL (추천, 무료 키: 월 50만 자)</option>
          <option value="microsoft">Microsoft 번역 (무료 키: 월 200만 자)</option>
          <option value="google">Google 무료 주소 (키 없음, 막힐 수 있음)</option>
          <option value="off">번역 안 함</option>
        </select>
        <div class="set-key" id="tr-key-row">
          <input type="password" id="tr-key" autocomplete="off" spellcheck="false" placeholder="API 키">
          <input type="text" id="tr-region" autocomplete="off" spellcheck="false" placeholder="리전 (예: koreacentral, 전역이면 비워 두기)">
        </div>
        <div class="set-help" id="tr-help"></div>
        <div class="set-actions">
          <button class="pill ghost" id="tr-test">테스트</button>
          <button class="pill" id="tr-save">저장</button>
        </div>
        <div class="set-msg" id="tr-msg"></div>
      </div>
    </div>
  </div>
  <div id="mini" class="mini-tile" title="눌러서 펼치기 · 끌어서 옮기기">
    <div class="mini-time" id="mini-time">--:--</div>
    <div class="mini-bars"><i></i><i></i><i></i></div>
  </div>
  <script src="desk.js"></script>
</body>
</html>
